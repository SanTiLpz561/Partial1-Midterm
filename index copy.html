<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./index.css">
  <title>Calculator app</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>
  <main class="main-section d-flex justify-content-center align-items-center" data-theme="blue" id="main-section">
    <div class="container">

      <div class="row justify-content-center">

        <div class="col-12 col-sm-9 col-md-6 col-lg-4">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <!-- Tittle to the left -->
            <h1 class="m-0 fs-3">calc</h1>
            <!-- Selector to the right -->
            <div class="d-flex align-items-end gap-3">
              <span class="theme-label">THEME</span>
              <div class="theme-switcher">
                <div class="d-flex justify-content-around px-2 mb-1 theme-numbers">
                  <span>1</span>
                  <span>2</span>
                  <span>3</span>
                </div>
                <!-- Slider -->
                  <input type="range" class="form-range theme-slider" min="0" max="2" value="0" id="themeSlider">
              </div>
            </div>
          </div>
          <div class="calculator-screen text-end mb-3 p-3">
            <span class="theme-color">399,981</span>
          </div>

                    <!-- Keypad -->
          <div class="row calculator-keypad-container text-center g-3 mt-4">

              <!-- Row 1 -->
              <div class="col-3"><button class="btn key-number" type="button">7</button></div>
              <div class="col-3"><button class="btn key-number" type="button">8</button></div>
              <div class="col-3"><button class="btn key-number" type="button">9</button></div>
              <div class="col-3"><button class="btn key-action" type="button">DEL</button></div>

              <!-- Row 2 -->
              <div class="col-3"><button class="btn key-number" type="button">4</button></div>
              <div class="col-3"><button class="btn key-number" type="button">5</button></div>
              <div class="col-3"><button class="btn key-number" type="button">6</button></div>
              <div class="col-3"><button class="btn key-number" type="button">+</button></div>

              <!-- Row 3 -->
              <div class="col-3"><button class="btn key-number" type="button">1</button></div>
              <div class="col-3"><button class="btn key-number" type="button">2</button></div>
              <div class="col-3"><button class="btn key-number" type="button">3</button></div>
              <div class="col-3"><button class="btn key-number" type="button">-</button></div>

              <!-- Row 4 -->
              <div class="col-3"><button class="btn key-number" type="button">.</button></div>
              <div class="col-3"><button class="btn key-number" type="button">0</button></div>
              <div class="col-3"><button class="btn key-number" type="button">/</button></div>
              <div class="col-3"><button class="btn key-number" type="button">×</button></div>

              <!-- Row 5: RESET y = (estos abarcan dos columnas cada uno) -->
              <div class="col-6"><button class="btn key-action w-100" type="button">RESET</button></div>
              <div class="col-6"><button class="btn key-equal w-100" type="button">=</button></div>

          </div>
        </div>

      </div>

    </div>
